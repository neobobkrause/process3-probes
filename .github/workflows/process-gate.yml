# Process3 gate (GAT-1): the required check "gate" on every pull request tip. The tool runs at
# the BASE's process pin, so a pull request that moves the pin is judged by the old one. The one
# exception is the tranche into main, judged by the tranche's pin when process3's own history
# shows it descends from main's (job gate only; job post stays at the base's pin). The
# checkout is GitHub's merge of the head into the base: the suite runs on the merged result.
# The record check runs here too: a pull_request_target workflow runs only from the default
# branch (measured 1 Nov on process3), so a check judged wholly by the base cannot run from a
# tranche. The workflow file itself still comes from the pull request, so merge (BOB's own
# tool) repeats the ownership and receipt checks, and Bob's ruleset pins the check's source.
# Two jobs (setup audit, 2 Nov): product code could read a write token from the gate's own
# process, so job gate, which runs product code, holds only read permissions, and job post,
# which holds the write token, runs no product code: it posts the row job gate uploaded.
# Each action is pinned by its full commit, with its version beside it (review of PR 13).
# Copied into a product as .github/workflows/process-gate.yml.
name: process-gate
# edited stays, title and body edits too (fewer runs, 4 Nov): a retarget is an edited event and
# the gate judges the new base, and a job skipped by an `if` would report a skipped "gate",
# which GitHub counts as passing the required check.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
# Each job names its own permissions; nothing is granted by default.
permissions: {}
concurrency:
  group: process-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    # 90 minutes (coordinator, 5 Nov): plane and control-plane gates take 40-42 minutes, so the
    # earlier 45 cancelled the copy's control-plane PR 290 twice (runs 1619, 1671), release path.
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - name: start the clock
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # Full history, but file contents only for the checkout; any other file the checks read
      # is fetched when read (decision 3A, Bob, 2 Nov, before the log; unverified: the full checkout of a large
      # product took up to 4 minutes). A private repository keeps the full fetch: the token is
      # not kept, so a later fetch of a file there could not authenticate.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          filter: ${{ !github.event.repository.private && 'blob:none' || '' }}
          persist-credentials: false
      - name: the base's process pin
        id: pin
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # The judge is the base's pin. Only a base with no Process3 at all (the setup pull
          # request) falls back to the head's pin; removing the pin later is a record finding.
          if pin=$(git rev-parse -q --verify "$BASE:.process"); then :;
          elif ! git rev-parse -q --verify "$BASE:process/config.json" >/dev/null && pin=$(git rev-parse -q --verify "HEAD:.process"); then
            echo "::warning::bootstrap: the base has no Process3; the head's pin judges this pull request"
          else
            echo "::error::the base has no process pin"; exit 1
          fi
          # The base's config when it has one (a failed read stops the run); the head's only at bootstrap.
          if git rev-parse -q --verify "$BASE:process/config.json" >/dev/null; then cfg=$(git show "$BASE:process/config.json")
          else cfg=$(git show "HEAD:process/config.json" 2>/dev/null || echo '{}'); fi
          repo=$(echo "$cfg" | jq -r '.process_repo // "https://github.com/neobobkrause/process3"')
          git clone -q --filter=blob:none "$repo" "$RUNNER_TEMP/process3"
          # The tranche into main (build/main-gate-2, 4 Nov): main's pin can be older than the
          # code that gated the tranche's jobs, and would run every suite past the gate's cap.
          # The tranche's own pin judges instead, only when it is a descendant of main's pin on
          # process3's own main or tranche, checked in the clone of the base's process_repo: a
          # later process, merged through process3's gate and review, that the tranche's job PRs
          # were judged by. This step itself comes from the merge commit's workflow file, as every
          # step does; merge's shim rule and Bob's ruleset stand behind that. Job post stays at
          # the base's pin, so a row field the older checkRow refuses posts no comment (fails closed).
          tranche=$(echo "$cfg" | jq -r '.tranche // empty')
          if [ -n "$tranche" ] && [ "$HEAD_REF" = "$tranche" ] && [ "$BASE_REF" = "$DEFAULT_BRANCH" ] && [ "$SAME_REPO" = "true" ] \
            && hpin=$(git rev-parse -q --verify "$HEAD_SHA:.process") && [ "$hpin" != "$pin" ]; then
            p3() { git -C "$RUNNER_TEMP/process3" "$@"; }
            if p3 merge-base --is-ancestor "$pin" "$hpin" 2>/dev/null \
              && { p3 merge-base --is-ancestor "$hpin" refs/remotes/origin/main 2>/dev/null || p3 merge-base --is-ancestor "$hpin" refs/remotes/origin/tranche 2>/dev/null; }; then
              echo "::notice::the tranche into $BASE_REF: the tranche's pin $hpin, a descendant of the base's $pin on process3, judges"
              pin=$hpin
            else
              echo "::warning::the tranche's pin $hpin is not a descendant of the base's $pin on process3's main or tranche; the base's pin judges"
            fi
          fi
          git -C "$RUNNER_TEMP/process3" checkout -q "$pin"
          echo "node=$(echo "$cfg" | jq -r '.node // "22"')" >> "$GITHUB_OUTPUT"
          echo "lockfiles=$(echo "$cfg" | jq -c '.lockfiles // []')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.pin.outputs.node }}
      - name: record check (size, paths, approvals, ledger), by the pin above, before any product code runs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node "$RUNNER_TEMP/process3/tool/p3.mjs" record-check --base "$BASE" --head "$HEAD_SHA" --branch "$HEAD_REF" --out "$RUNNER_TEMP/record.json"
      # Chromium for the product's browser tests (build/gate-chromium, 4 Nov): the runner has
      # none, so tests a job's container passes failed or skipped here. The build is the one the
      # top-level playwright-core pins in each lock file the pin step's config lists (`lockfiles`),
      # read here, never written down, and named in the log. CHROMIUM names the newest
      # version's binary (a warning when the lock files pin more than one); a plain
      # chromium.launch() finds each pinned build where playwright installs it. The cache is
      # GitHub's, scoped to the pull request's own ref (the gate runs on no push), so it serves a
      # pull request's later runs only; a first run downloads.
      - name: the browser the product's lock files pin
        id: browser
        env:
          LOCKFILES: ${{ steps.pin.outputs.lockfiles }}
        run: |
          vs=$(echo "${LOCKFILES:-[]}" | jq -r '.[] | strings' | grep -vE '(^/|(^|/)\.\.(/|$))' | while IFS= read -r f; do
            jq -r '.packages["node_modules/playwright-core"].version // empty' "$f" 2>/dev/null || true
          done | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' | sort -uV | tr '\n' ' ' | sed 's/ $//') || true
          if [ -z "$vs" ]; then echo "::notice::browser: no playwright-core in the lock files the pin step's config lists; none installed"; fi
          case "$vs" in *" "*) echo "::warning::browser: the lock files pin playwright-core $vs; CHROMIUM names the newest";; esac
          echo "versions=$vs" >> "$GITHUB_OUTPUT"
      # Restored here and saved straight after the install, before any product code runs, and
      # only on a miss: a key once saved is never written again, so no test can change what a
      # later run restores (confirming review of PR 129).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: browser-cache
        if: steps.browser.outputs.versions != ''
        with:
          path: ~/.cache/ms-playwright
          key: p3-chromium-${{ runner.os }}-${{ steps.browser.outputs.versions }}
      - name: install the browser
        if: steps.browser.outputs.versions != ''
        timeout-minutes: 10
        working-directory: ${{ runner.temp }}
        env:
          VERSIONS: ${{ steps.browser.outputs.versions }}
        run: |
          t=$(date +%s)
          # A playwright-core older than the runner's OS refuses to download there (measured 4 Nov:
          # 1.56.1 on ubuntu-latest, Ubuntu 26.04, "does not support chromium on ubuntu26.04-x64"),
          # and its installer, made to take the ubuntu24.04-x64 build, hung 10 minutes after the
          # download (copy PR 320). So the second attempt, also the retry, fetches each build
          # that build's dry run names from its own URL, unpacks it where playwright looks, and
          # marks it installed as playwright does; no apt libraries (the runner image carries
          # Chrome's). The binary must then run.
          fetch() {
            npx -y "playwright-core@$1" install --dry-run chromium \
              | awk '/^ *Install location:/{if (d) print d u; d=$3; u=""} /^ *Download (url|fallback [0-9]+):/{u=u" "$NF} END{if (d) print d u}' | sort -u \
              | while read -r dir urls; do
                  [ -f "$dir/INSTALLATION_COMPLETE" ] && continue
                  got=
                  for url in $urls; do curl -fsSL --retry 2 -o "$RUNNER_TEMP/browser.zip" "$url" && got=$url && break; done
                  [ -n "$got" ] && mkdir -p "$dir" && unzip -q -o "$RUNNER_TEMP/browser.zip" -d "$dir" && touch "$dir/INSTALLATION_COMPLETE" || exit 1
                  echo "browser: fetched $got"
                done
          }
          for v in $VERSIONS; do
            unset PLAYWRIGHT_HOST_PLATFORM_OVERRIDE
            if ! timeout 300 npx -y "playwright-core@$v" install --with-deps chromium; then
              echo "::warning::browser: playwright-core $v did not install on $(. /etc/os-release 2>/dev/null; echo "${PRETTY_NAME:-this OS}") (an OS newer than it knows, an outage or the 300 s bound); fetching its ubuntu24.04-x64 build without system libraries"
              export PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64
              if ! fetch "$v"; then
                echo "::error::browser: playwright-core $v could not install Chromium (twice); the gate does not run the tests without it"; exit 1
              fi
            fi
            loc=$(npx -y "playwright-core@$v" install --dry-run chromium | sed -n 's/^ *Install location: *//p' | head -1) || true
            exe=$(find "$loc" -path '*/chrome-linux*/chrome' -type f 2>/dev/null | head -1) || true
            if [ -z "$exe" ]; then echo "::error::browser: playwright-core $v installed no Chromium under $loc"; exit 1; fi
            if ! ver=$("$exe" --version); then echo "::error::browser: $exe (playwright-core $v) does not run here"; exit 1; fi
            echo "::notice::browser: $ver for playwright-core $v at $exe${PLAYWRIGHT_HOST_PLATFORM_OVERRIDE:+ (the $PLAYWRIGHT_HOST_PLATFORM_OVERRIDE build)}"
          done
          echo "CHROMIUM=$exe" >> "$GITHUB_ENV"
          echo "browser: installed in $(( $(date +%s) - t )) s"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.browser.outputs.versions != '' && steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: p3-chromium-${{ runner.os }}-${{ steps.browser.outputs.versions }}
      - name: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
        # The row goes to the artifact only; job post writes the comment from it.
        run: node "$RUNNER_TEMP/process3/tool/p3.mjs" gate --base "$BASE" --head "$HEAD_SHA" --branch "$HEAD_REF" --pr "$PR" --draft "$DRAFT" --started "$STARTED" --no-post --out "$RUNNER_TEMP/gate.json"
      - name: the run's own record of its row (merge trusts a row only when this artifact matches it)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-row
          path: ${{ runner.temp }}/gate.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90
  # The comment, from the artifact, by the base's pin. No checkout of the pull request: the
  # artifact first, into a directory of its own, then only the base's tree, for its pin and
  # config, and the process clone at that pin. The comment holds the artifact's row as
  # uploaded, so merge's verifyRow still finds the two equal.
  post:
    needs: gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: gate-row
          path: ${{ runner.temp }}/row
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          sparse-checkout: process/config.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: base
      - name: the base's process pin
        id: pin
        run: |
          # The base's pin only. At bootstrap (a base with no pin) the head's pin judges in job
          # gate, but its code never gets this job's token: no comment is posted.
          if ! pin=$(git -C base rev-parse -q --verify "HEAD:.process"); then
            echo "::warning::the base has no process pin; no gate comment is posted"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cfg=$(cat base/process/config.json 2>/dev/null || echo '{}')
          repo=$(echo "$cfg" | jq -r '.process_repo // "https://github.com/neobobkrause/process3"')
          git clone -q --filter=blob:none "$repo" "$RUNNER_TEMP/process3"
          git -C "$RUNNER_TEMP/process3" checkout -q "$pin"
          echo "node=$(echo "$cfg" | jq -r '.node // "22"')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.pin.outputs.skip != '1'
        with:
          node-version: ${{ steps.pin.outputs.node }}
      - name: post the gate row
        if: steps.pin.outputs.skip != '1'
        working-directory: ${{ runner.temp }}/process3
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          GATE_RESULT: ${{ needs.gate.result }}
        run: node tool/p3.mjs gate --post "$RUNNER_TEMP/row/gate.json" --pr "$PR" --head "$HEAD_SHA" --gate-result "$GATE_RESULT"
